<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Login POS Jahitan</title>

  <!-- ICON -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .login-box{
      background:white;
      width:100%;
      max-width:400px;
      padding:25px;
      border-radius:20px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    .logo{
      text-align:center;
      margin-bottom:25px;
    }

    .logo i{
      font-size:50px;
      color:#111;
      margin-bottom:10px;
    }

    .logo h1{
      font-size:28px;
      color:#111;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid #ddd;
      margin-bottom:15px;
      font-size:15px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#111;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }

    .info{
      text-align:center;
      margin-top:15px;
      color:#666;
      font-size:14px;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">

      <i class="fa-solid fa-scissors"></i>

      <h1>POS Jahitan</h1>

    </div>

    <!-- USERNAME -->

    <input
      type="text"
      id="username"
      placeholder="Masukkan Username">

    <!-- PASSWORD -->

    <input
      type="password"
      id="password"
      placeholder="Masukkan Password">

    <!-- BUTTON LOGIN -->

    <button onclick="login()">

      Login

    </button>

    <div class="info">

      Username: admin <br>
      Password: 12345

    </div>

  </div>

  <script>

    // =========================
    // CEK LOGIN
    // =========================

    if(localStorage.getItem("login") == "true"){

      window.location.href = "index.html";
    }

    // =========================
    // FUNCTION LOGIN
    // =========================

    function login(){

      let username =
        document.getElementById("username").value;

      let password =
        document.getElementById("password").value;

      // USER LOGIN

      if(
        username == "admin"
        &&
        password == "12345"
      ){

        // SIMPAN STATUS LOGIN

        localStorage.setItem(
          "login",
          "true"
        );

        // PINDAH HALAMAN

        window.location.href = "index.html";

      }else{

        alert("Username atau password salah");
      }
    }

  </script>

</body>
</html>
